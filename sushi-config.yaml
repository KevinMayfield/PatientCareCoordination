id: fhir.nwgenomics.nhs.uk.patientcarecoordination
canonical: https://fhir.nwgenomics.nhs.uk/PatientCareCoordination
version: 0.1.0
name: PatientCareCoordination
title: Closed Loop Referral and Care Coordination (Proof of Concept)
description: PROOF OF CONCEPT ONLY - not an authoritative source. General order (referral) and report (outcome) workflow patterns for NHS England, based on IHE 360X Closed Loop Referral, covering eRS, BaRS, Transfer of Care, MESH, GP Connect, IM1, EPS, HL7 v2, HL7 Europe Hospital Discharge Report and EU Health Data API, extended to virtual wards (hospital at home) and IHE Dynamic Care Planning
releaseLabel: proof-of-concept
status: draft
experimental: true
publisher:
  - name: NHS North West Genomics
  - url: https://www.nwgenomics.nhs.uk/contact-us
license: CC-BY-4.0
fhirVersion: 4.0.1
jurisdiction: urn:iso:std:iso:3166#GB "United Kingdom of Great Britain and Northern Ireland"
copyrightYear: 2026+

dependencies:
  hl7.fhir.eu.hdr: 1.0.0
  # versions used by hl7.fhir.eu.hdr, declared so SUSHI can resolve them
  hl7.fhir.eu.base: 2.0.1
  hl7.fhir.eu.extensions.r4: 1.3.1
  hl7.fhir.uv.ips: 2.0.1
  hl7.fhir.uv.xver-r5.r4: 0.1.0

FSHOnly: false
parameters:
  shownav: true
  apply-contact: 'true'
  apply-jurisdiction: 'true'
  apply-publisher: 'true'
  apply-version: 'true'
  # SNOMED CT UK Edition for expansions/validation (same as the NW GMSA IG)
  path-expansion-params: '../resources/Parameters-exp-params.json'

